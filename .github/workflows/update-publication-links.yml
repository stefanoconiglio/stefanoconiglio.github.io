name: Update publication links

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-publication-links.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add verified publication links
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          html_path = Path("publications.html")
          cv_path = Path("cv/sections/publications.tex")
          html = html_path.read_text(encoding="utf-8")
          cv = cv_path.read_text(encoding="utf-8")

          def exact_replace(text, old, new, what):
              n = text.count(old)
              if n != 1:
                  raise RuntimeError(f"{what}: expected exactly one match, found {n}")
              return text.replace(old, new, 1)

          # Metadata corrections found while checking the bibliography against
          # publisher/proceedings pages.
          html = exact_replace(
              html,
              'https://openreview.net/forum?id=ghk8lnOYRq',
              'https://openreview.net/forum?id=VJAqqtVXfD',
              'P30 OpenReview link',
          )
          html = exact_replace(
              html,
              '<strong>Sheaves Reloaded: A Directional Awakening</strong>',
              '<strong>Sheaves Reloaded: A Direction Awakening</strong>',
              'P28 title',
          )
          html = exact_replace(
              html,
              '<strong>A Unified Framework for Multistage Discrete Optimization</strong><br>\n            S. Coniglio, T. Ralphs<br>',
              '<strong>A Unified Framework for Multistage Mixed Integer Linear Optimization</strong><br>\n            S. Bolusani, S. Coniglio, T. Ralphs, S. Tahernejad<br>',
              'C1 title/authors',
          )
          html = exact_replace(
              html,
              '<em>Artificial Intelligence, 227, 1–31</em>',
              '<em>Artificial Intelligence, 277, 1–31</em>',
              'J11 volume',
          )
          html = exact_replace(
              html,
              '<em>International Symposium on Experimental Algorithms (SEA 2017), London, UK. LIPIcs pages 21:1–29:13.</em>',
              '<em>International Symposium on Experimental Algorithms (SEA 2017), London, UK. LIPIcs pages 29:1–29:13.</em>',
              'P20 article pages',
          )
          html = exact_replace(
              html,
              'https://dl.acm.org/doi/10.5555/3306127.3331784',
              'https://doi.org/10.65109/qzba3283',
              'P23 proceedings link',
          )

          cv = exact_replace(
              cv,
              r'\cventry{[C1]}{A Unified Framework for Multistage Discrete Optimization}{with T.~Ralphs}',
              r'\cventry{[C1]}{A Unified Framework for Multistage Mixed Integer Linear Optimization}{with S.~Bolusani, T.~Ralphs, S.~Tahernejad}',
              'CV C1 title/authors',
          )
          cv = exact_replace(cv, 'Annals of Operations Research, 238:309--335 (2023)', 'Annals of Operations Research, 328(1):309--335 (2023)', 'CV J25 volume')
          cv = exact_replace(cv, '{Correlation analysis of deep learning methods in S-ICD}', '{Correlation analysis of deep learning methods in S-ICD screening}', 'CV J24 title')
          cv = exact_replace(cv, 'European Joural of Operational Research', 'European Journal of Operational Research', 'CV J22 journal typo')
          cv = exact_replace(cv, 'Artificial Intelligence (AIJ): 227, 1--31 (2019)', 'Artificial Intelligence (AIJ): 277, 1--31 (2019)', 'CV J11 volume')
          cv = exact_replace(cv, 'Proceedings of 41st AAAI', 'Proceedings of the 38th AAAI', 'CV P26 proceedings ordinal')
          cv = exact_replace(cv, 'Proceedings of 40th AAAI', 'Proceedings of the 37th AAAI', 'CV P25 proceedings ordinal')
          cv = exact_replace(cv, 'pages 21:1--29:13, 2017', 'pages 29:1--29:13, 2017', 'CV P20 article pages')

          def append_to_year(text, year, snippet):
              marker = f'<h2 class="section-label">{year}</h2>'
              p = text.find(marker)
              if p < 0:
                  raise RuntimeError(f"year {year} not found")
              u = text.find('<ul class="news">', p)
              e = text.find('</ul>', u)
              return text[:e] + snippet + text[e:]

          # Conference papers present in the CV but missing from the webpage.
