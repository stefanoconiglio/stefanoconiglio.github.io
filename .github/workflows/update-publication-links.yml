            E. Amaldi, S. Coniglio, L. Gianoli, C. Ileri<br>
            <em>International Network Optimization Conference (INOC), Tenerife, Spain. Electronic Notes in Discrete Mathematics, 41, 543–550.</em>
          </div>
        </li>
      '''),
          ]:
