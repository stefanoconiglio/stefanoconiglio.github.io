            <em>Cologne-Twente Workshop on Graphs and Combinatorial Optimization (CTW), Frascati (Rome), Italy.</em>
          </div>
        </li>
        <li><span class="date">2011</span>
          <div>
            <strong>Formulations and heuristics for the k-Piecewise Affine Model Fitting problem</strong><br>
