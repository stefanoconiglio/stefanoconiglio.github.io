          def add_links_to_html(text, title, links):
              needle = f'<strong>{title}</strong>'
              p = text.find(needle)
              if p < 0:
                  raise RuntimeError(f"HTML title not found: {title}")
              s = text.rfind('<li', 0, p)
              e = text.find('</li>', p)
              if s < 0 or e < 0:
                  raise RuntimeError(f"HTML block not found: {title}")
              e += len('</li>')
              block = text[s:e]
              close = block.rfind('</div>')
              if close < 0:
                  raise RuntimeError(f"HTML div not found: {title}")
              for label, url in links:
                  if url not in block:
                      piece = f'\n            &nbsp;·&nbsp; <a href="{url}">{label}</a>'
                      block = block[:close] + piece + block[close:]
                      close += len(piece)
              return text[:s] + block + text[e:]

