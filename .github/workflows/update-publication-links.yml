            <strong>An adaptive point-reassignment metaheuristic for the k-hyperplane clustering problem</strong><br>
            E. Amaldi, S. Coniglio<br>
            <em>Metaheuristic International Conference (MIC), Hamburg, Germany.</em>
          </div>
        </li>
      </ul>
'''
              marker = '    </main>'
              if marker not in html:
                  raise RuntimeError('main closing tag not found')
              html = html.replace(marker, section + marker, 1)

