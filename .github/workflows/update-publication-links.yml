                  html = append_to_year(html, '2013', snippet)

          if '<h2 class="section-label">2012</h2>' not in html:
              marker = '      <!-- ======= 2010 ======= -->'
              section = '''      <!-- ======= 2012 ======= -->
      <h2 class="section-label">2012</h2>
      <ul class="news">
        <li><span class="date">2012</span>
          <div>
            <strong>k-Piecewise Affine Model Fitting: Heuristics based on multiway linear classification</strong><br>
            E. Amaldi, S. Coniglio, L. Taccari<br>
            <em>Cologne-Twente Workshop on Graphs and Combinatorial Optimization (CTW), Munich, Germany, pp. 16–19.</em>
          </div>
        </li>
      </ul>

      <!-- ======= 2011 ======= -->
      <h2 class="section-label">2011</h2>
      <ul class="news">
        <li><span class="date">2011</span>
          <div>
            <strong>The impact of the norm on the k-Hyperplane Clustering problem: relaxations, restrictions, approximation factors, and exact formulations</strong><br>
