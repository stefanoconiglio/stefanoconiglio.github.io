          <div>
            <strong>Facility location with item storage and delivery</strong><br>
            S. Coniglio, J. Fliege, R. Walton<br>
            <em>Optimization and Decision Science (ODS), Sorrento, Italy. Springer Proceedings in Mathematics and Statistics.</em>
          </div>
        </li>
      ''')

