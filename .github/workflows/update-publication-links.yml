          if len(cv_links) != 62:
              raise RuntimeError(f"unexpected CV link map size: {len(cv_links)}")

          def arg_spans(line):
              p = line.find(r'\cventry')
              if p < 0:
                  raise RuntimeError('not a cventry line')
              p += len(r'\cventry')
              spans = []
              for _ in range(6):
                  while p < len(line) and line[p].isspace():
                      p += 1
                  if p >= len(line) or line[p] != '{':
                      raise RuntimeError(f"cannot parse cventry: {line}")
                  p += 1
                  start = p
                  depth = 1
                  while p < len(line) and depth:
                      ch = line[p]
                      escaped = p > 0 and line[p - 1] == '\\'
                      if ch == '{' and not escaped:
                          depth += 1
                      elif ch == '}' and not escaped:
                          depth -= 1
                          if depth == 0:
                              spans.append((start, p))
                              p += 1
                              break
                      p += 1
                  if depth:
                      raise RuntimeError(f"unbalanced cventry: {line}")
              return spans

          lines = cv.splitlines(keepends=True)
          seen = set()
          for i, line in enumerate(lines):
              for label, links in cv_links.items():
                  needle = r'\cventry{[' + label + ']}'
                  if needle not in line:
                      continue
                  if label in seen:
                      raise RuntimeError(f"duplicate CV label: {label}")
                  spans = arg_spans(line)
                  a, b = spans[3]
                  venue = line[a:b]
                  pieces = []
                  for link_label, url in links:
                      if url not in line:
                          pieces.append((link_label, url))
                  if pieces:
                      extra = r'\quad ' + r'\,$\cdot$\,'.join(r'\href{' + url + '}{' + link_label + '}' for link_label, url in pieces)
                      line = line[:b] + extra + line[b:]
                      lines[i] = line
                  seen.add(label)
                  break

          missing = sorted(set(cv_links) - seen)
          if missing:
              raise RuntimeError(f"CV labels not found: {missing}")
          cv = ''.join(lines)

          html_path.write_text(html, encoding="utf-8")
          cv_path.write_text(cv, encoding="utf-8")
          PY

