          <div>
            <strong>Bound-optimal cutting planes</strong><br>
            S. Coniglio<br>
            <em>Cologne-Twente Workshop on Graphs and Combinatorial Optimization (CTW), Enschede, Netherlands, pp. 59–62.</em>
          </div>
        </li>
      '''),
