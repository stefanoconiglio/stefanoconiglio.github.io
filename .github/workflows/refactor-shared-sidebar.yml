name: Refactor shared sidebar

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/refactor-shared-sidebar.yml"

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create shared sidebar and improve narrow-screen layout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          pages = [
              "index.html",
              "about.html",
              "publications.html",
              "talks.html",
              "projects.html",
              "engagement.html",
              "news.html",
          ]

          sidebar = '''<aside class="sidebar">
            <div class="photo-wrap">
              <img src="coniglio-dse-edt.jpg" alt="Stefano Coniglio">
            </div>
            <div class="sidebar-meta">
              <h1 class="name">Stefano Coniglio</h1>
              <p class="title">
                Associate Professor of Computer Science<br>
                Department of Economics<br>
                University of Bergamo
              </p>
              <ul class="contact">
                <li class="location">Bergamo, Italy</li>
                <li><a href="mailto:stefano.coniglio@unibg.it">Email</a></li>
                <li><a href="cv/cv_SC.pdf">Curriculum vitae (PDF)</a></li>
                <li><a href="https://unibg.unifind.cineca.it/individual?uri=http%3A%2F%2Firises.unibg.it%2Fresource%2Fperson%2F134388" rel="me">UniBg profile</a></li>
                <li><a href="https://scholar.google.com/citations?user=F9mrD0gAAAAJ" rel="me">Google Scholar</a></li>
                <li><a href="https://orcid.org/0000-0001-9568-4385" rel="me">ORCID</a></li>
                <li><a href="https://dblp.org/pid/00/7060.html" rel="me">DBLP</a></li>
                <li><a href="https://github.com/stefanoconiglio" rel="me">GitHub</a></li>
              </ul>
            </div>
          </aside>
          '''

          Path("_includes").mkdir(exist_ok=True)
          Path("_includes/sidebar.html").write_text(sidebar, encoding="utf-8")

          pattern = re.compile(r'(?s)    <aside class="sidebar">.*?    </aside>')
          for page in pages:
              path = Path(page)
              text = path.read_text(encoding="utf-8")
              if not text.startswith("---\n"):
                  text = "---\n---\n" + text
              text, count = pattern.subn("    {% include sidebar.html %}", text, count=1)
              if count != 1:
                  raise RuntimeError(f"Expected exactly one sidebar in {page}, found {count}")
              path.write_text(text, encoding="utf-8")

          css_path = Path("style.css")
          css = css_path.read_text(encoding="utf-8")
          mobile_marker = "/* ---------- Mobile ---------- */"
          if mobile_marker not in css:
              raise RuntimeError("Could not find the existing mobile CSS section")

          css = css.split(mobile_marker, 1)[0].rstrip() + '''\n\n/* ---------- Narrow / mobile ---------- */
          @media (max-width: 860px) {
            html { font-size: 16px; }
            .topnav { padding: 14px 20px; }
            .topnav ul {
              justify-content: center;
              gap: 12px 20px;
              flex-wrap: wrap;
            }
            .layout {
              grid-template-columns: 1fr;
              gap: 28px;
              max-width: 760px;
              margin: 28px auto 56px;
              padding: 0 24px;
            }
            .sidebar {
              position: static;
              display: grid;
              grid-template-columns: 120px minmax(0, 1fr);
              gap: 0 22px;
              align-items: start;
            }
            .photo-wrap {
              width: 120px;
              margin: 0;
            }
            .sidebar-meta {
              min-width: 0;
              padding-top: 2px;
            }
            .sidebar .name {
              margin-bottom: 5px;
            }
            .sidebar .title {
              margin-bottom: 10px;
              font-size: 0.90rem;
              line-height: 1.4;
            }
            .sidebar .contact {
              display: flex;
              flex-wrap: wrap;
              column-gap: 16px;
              row-gap: 0;
              font-size: 0.78rem;
              line-height: 1.65;
            }
            .sidebar .contact li { margin: 0; }
            .sidebar .contact .location {
              flex-basis: 100%;
              margin-bottom: 2px;
            }
            .news li {
              grid-template-columns: 90px minmax(0, 1fr);
              gap: 14px;
            }
            footer {
              max-width: 760px;
              padding: 20px 24px;
            }
          }

          @media (max-width: 520px) {
            .topnav ul {
              gap: 10px 16px;
              font-size: 0.78rem;
            }
            .layout {
              margin-top: 22px;
              padding: 0 18px;
            }
            .sidebar {
              grid-template-columns: 88px minmax(0, 1fr);
              gap: 0 16px;
            }
            .photo-wrap { width: 88px; }
            .sidebar .name { font-size: 1.08rem; }
            .sidebar .title {
              margin-bottom: 8px;
              font-size: 0.84rem;
            }
            .sidebar .contact {
              column-gap: 12px;
              font-size: 0.74rem;
            }
            .news li {
              grid-template-columns: 1fr;
              gap: 2px;
              padding: 9px 0;
            }
            .news .date { padding-top: 0; }
            footer { padding: 18px; }
          }
          '''
          css_path.write_text(css, encoding="utf-8")

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          readme = readme.replace(
              "No build step. No Jekyll. Edit the HTML directly.",
              "GitHub Pages builds the site with Jekyll. Shared fragments such as the sidebar live in `_includes/`; the browser still receives ordinary static HTML."
          )
          if "_includes/sidebar.html" not in readme:
              readme = readme.replace(
                  "- `style.css` — shared stylesheet for all pages",
                  "- `style.css` — shared stylesheet for all pages\n- `_includes/sidebar.html` — shared profile/sidebar included in every page via Jekyll/Liquid"
              )
          if "local Jekyll" not in readme:
              readme += "\n\n## Local preview\n\nGitHub Pages expands the Liquid includes automatically. To preview the fully rendered site locally, run a local Jekyll server; opening a source `.html` file directly from disk will not expand `{% include ... %}` tags.\n"
          readme_path.write_text(readme, encoding="utf-8")
          PY

      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _includes/sidebar.html index.html about.html publications.html talks.html projects.html engagement.html news.html style.css README.md
          git commit -m "Use shared sidebar and improve responsive layout"
          git push
