name: Fix responsive sidebar

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-responsive-sidebar.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix sidebar and narrow layout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          sidebar = '''<aside class="sidebar">
            <div class="photo-wrap">
              <img src="coniglio-dse-edt.jpg" alt="Stefano Coniglio">
            </div>
            <div class="sidebar-meta">
              <h1 class="name">Stefano Coniglio</h1>
              <p class="title">
                Associate Professor of Computer Science<br>
                Department of Economics<br>
                University of Bergamo<br>
                Bergamo, Italy
              </p>
              <ul class="contact">
                <li><a href="mailto:stefano.coniglio@unibg.it">Email</a></li>
                <li><a href="cv/cv_SC.pdf">Curriculum vitae (PDF)</a></li>
                <li><a href="https://unibg.unifind.cineca.it/individual?uri=http%3A%2F%2Firises.unibg.it%2Fresource%2Fperson%2F134388" rel="me">UniBg profile</a></li>
                <li><a href="https://scholar.google.com/citations?user=F9mrD0gAAAAJ" rel="me">Google Scholar</a></li>
                <li><a href="https://orcid.org/0000-0001-9568-4385" rel="me">ORCID</a></li>
                <li><a href="https://dblp.org/pid/00/7060.html" rel="me">DBLP</a></li>
                <li><a href="https://github.com/stefanoconiglio" rel="me">GitHub</a></li>
              </ul>
            </div>
          </aside>
          '''
          Path('_includes/sidebar.html').write_text(sidebar, encoding='utf-8')

          pages = ['index.html','about.html','publications.html','talks.html','projects.html','engagement.html','news.html']
          for name in pages:
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              text = text.replace('href="style.css"', 'href="style.css?v=20260908c"')
              text = text.replace('href="style.css?v=20260908b"', 'href="style.css?v=20260908c"')
              p.write_text(text, encoding='utf-8')

          css = Path('style.css').read_text(encoding='utf-8')
          marker = '/* ---------- Narrow / mobile ---------- */'
          css = css.split(marker, 1)[0].rstrip() + '''\n\n/* ---------- Narrow / mobile ---------- */
          @media (max-width: 860px) {
            html { font-size: 16px; }
            .topnav { padding: 13px 18px; }
            .topnav ul {
              justify-content: center;
              gap: 10px 18px;
              flex-wrap: wrap;
            }
            .layout {
              grid-template-columns: 1fr;
              gap: 22px;
              max-width: 760px;
              margin: 24px auto 52px;
              padding: 0 22px;
            }
            .sidebar {
              position: static;
              display: grid;
              grid-template-columns: 112px minmax(0, 1fr);
              gap: 18px;
              align-items: start;
            }
            .photo-wrap {
              width: 112px;
              margin: 0;
            }
            .sidebar-meta {
              min-width: 0;
              display: block;
              padding: 0;
            }
            .sidebar .name {
              margin: 0 0 5px;
              font-size: 1.18rem;
            }
            .sidebar .title {
              margin: 0 0 8px;
              font-size: 0.88rem;
              line-height: 1.38;
            }
            .sidebar .contact {
              display: flex;
              flex-wrap: wrap;
              gap: 0 14px;
              margin: 0;
              font-size: 0.76rem;
              line-height: 1.7;
            }
            .sidebar .contact li { margin: 0; }
            .content { width: 100%; }
            .content > h2:first-child { margin-top: 0; }
            .news li {
              grid-template-columns: 76px minmax(0, 1fr);
              gap: 12px;
            }
            footer {
              max-width: 760px;
              padding: 20px 22px;
            }
          }

          @media (max-width: 560px) {
            .topnav ul {
              gap: 8px 14px;
              font-size: 0.77rem;
            }
            .layout {
              margin-top: 20px;
              padding: 0 16px;
              gap: 18px;
            }
            .sidebar {
              grid-template-columns: 88px minmax(0, 1fr);
              gap: 14px;
            }
            .photo-wrap { width: 88px; }
            .sidebar .name { font-size: 1.08rem; }
            .sidebar .title { font-size: 0.82rem; }
            .sidebar .contact {
              gap: 0 11px;
              font-size: 0.72rem;
            }
            .news li {
              grid-template-columns: 1fr;
              gap: 2px;
              padding: 9px 0;
            }
            .news .date { padding-top: 0; }
            footer { padding: 18px 16px; }
          }
          '''
          Path('style.css').write_text(css, encoding='utf-8')

          for dead in [
              Path('_includes/sidebar-v2-preview.tmp'),
              Path('.github/workflows/refactor-shared-sidebar.yml'),
              Path('.github/workflows/fix-responsive-sidebar.yml'),
          ]:
              if dead.exists():
                  dead.unlink()
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix shared sidebar and narrow-screen layout"
          git push
