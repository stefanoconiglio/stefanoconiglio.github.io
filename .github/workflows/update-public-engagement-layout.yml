name: Update public engagement layout

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-public-engagement-layout.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reorder sections and update La Traccia title
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("engagement.html")
          text = path.read_text(encoding="utf-8")

          written_marker = '      <h2 class="section-label">Written contributions</h2>\n'
          events_marker = '      <h2 class="section-label">Events &amp; talks</h2>\n'
          main_marker = '    </main>\n'

          before, found_written, rest = text.partition(written_marker)
          written_body, found_events, rest2 = rest.partition(events_marker)
          events_body, found_main, after = rest2.partition(main_marker)
          if found_written and found_events and found_main:
              text = before + events_marker + events_body.rstrip() + "\n\n" + written_marker + written_body.rstrip() + "\n" + main_marker + after

          text = text.replace(
              'Three-hour training session <em>"Introduzione all\'AI"</em> for teaching staff,',
              'Three-hour training session <em>"Come l’IA ha iniziato a parlare: una sguardo storico-scientifico sull’IA moderna"</em> for teaching staff,'
          )
          path.write_text(text, encoding="utf-8")

          cv_path = Path("cv/sections/public_engagement.tex")
          cv = cv_path.read_text(encoding="utf-8")
          cv = cv.replace(
              "Training session, ``Introduzione all'AI''",
              "Training session, ``Come l’IA ha iniziato a parlare: una sguardo storico-scientifico sull’IA moderna''",
          )
          cv_path.write_text(cv, encoding="utf-8")
          PY

      - name: Commit changes and remove one-off workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/update-public-engagement-layout.yml
          git add engagement.html cv/sections/public_engagement.tex
          git diff --cached --stat
          git commit -m "Reorder public engagement and update La Traccia title"
          git push
