name: Build CV

on:
  push:
    branches:
      - main
    paths:
      - "cv/**/*.tex"
      - "cv/firma.jpg"
      - "coniglio-dse-edt.jpg"
      - ".github/workflows/build-cv.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile CV
        uses: xu-cheng/latex-action@v4
        with:
          root_file: cv_SC.tex
          working_directory: cv
          texlive_version: 2026
          os: debian

      - name: Commit rebuilt PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cv/cv_SC.pdf
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Rebuild CV PDF"
          git push

