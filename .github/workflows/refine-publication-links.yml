name: Refine publication links

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/refine-publication-links.yml"

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refine links
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          html_path = Path('publications.html')
          pub_path = Path('cv/sections/publications.tex')
          cv_path = Path('cv/cv_SC.tex')

          html = html_path.read_text(encoding='utf-8')
          pubs = pub_path.read_text(encoding='utf-8')
          cv = cv_path.read_text(encoding='utf-8')

          blocked_html = ('aisberg.unibg.it','eprints.soton.ac.uk','re.public.polimi.it','pmc.ncbi.nlm.nih.gov','dblp.org/rec/')
          item_re = re.compile(r'<li><span class="date">.*?</li>', re.S)
          anchor_re = re.compile(r'\s*&nbsp;·&nbsp;\s*<a href="([^"]+)">([^<]+)</a>')

          def clean_item(match):
              block = match.group(0)
              seen = set()
              def clean_anchor(am):
                  url, label = am.group(1), am.group(2)
                  if any(domain in url for domain in blocked_html):
                      return ''
                  if (label, url) in seen:
                      return ''
                  seen.add((label, url))
                  return am.group(0)
              return anchor_re.sub(clean_anchor, block)

          html = item_re.sub(clean_item, html)

          macro = '\\newcommand{\\publink}[2]{\\href{#1}{\\textcolor{blue}{\\underline{\\fontfamily{pcr}\\selectfont #2}}}}\n'
          if '\\newcommand{\\publink}' not in cv:
              marker = '\\usepackage[bottom=1in,scale=0.89]{geometry} % Reduce document margins\n'
              if marker not in cv:
                  raise RuntimeError('CV preamble insertion point not found')
              cv = cv.replace(marker, marker + '\n' + macro, 1)

          href_re = re.compile(r'\\href\{([^{}]+)\}\{([^{}]+)\}')

          def arg_spans(line):
              p = line.find(r'\cventry')
              if p < 0: return []
              p += len(r'\cventry')
              spans = []
              for _ in range(6):
                  while p < len(line) and line[p].isspace(): p += 1
                  if p >= len(line) or line[p] != '{': return []
                  p += 1; start = p; depth = 1
                  while p < len(line) and depth:
                      ch = line[p]; escaped = p > 0 and line[p-1] == '\\'
                      if ch == '{' and not escaped: depth += 1
                      elif ch == '}' and not escaped:
                          depth -= 1
                          if depth == 0:
                              spans.append((start,p)); p += 1; break
                      p += 1
                  if depth: return []
              return spans

          def allowed(url,label):
              return ('arxiv.org/' in url or 'optimization-online.org/' in url or label in {'Publisher','Proceedings','OpenReview'})

          out=[]
          for line in pubs.splitlines(keepends=True):
              if '\\cventry' not in line or '\\href{' not in line:
                  out.append(line); continue
              spans=arg_spans(line)
              if len(spans)<4:
                  out.append(line); continue
              a,b=spans[3]
              venue=line[a:b]
              links=[(u,l) for u,l in href_re.findall(venue) if allowed(u,l)]
              first=venue.find('\\quad \\href')
              if first<0: first=venue.find('\\href')
              base=venue[:first].rstrip() if first>=0 else venue
              if links:
                  tail=r'\quad '+r'\,$\cdot$\,'.join(r'\publink{'+u+'}{'+l+'}' for u,l in links)
                  venue=base+tail
              else:
                  venue=base
              out.append(line[:a]+venue+line[b:])
          pubs=''.join(out)

          forbidden=['aisberg.unibg.it','eprints.soton.ac.uk','re.public.polimi.it','pmc.ncbi.nlm.nih.gov','dblp.org/rec/']
          for bad in forbidden:
              if bad in html or bad in pubs:
                  raise RuntimeError('Forbidden publication link remains: '+bad)

          html_path.write_text(html,encoding='utf-8')
          pub_path.write_text(pubs,encoding='utf-8')
          cv_path.write_text(cv,encoding='utf-8')
          PY

      - name: Commit changes and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/refine-publication-links.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publications.html cv/sections/publications.tex cv/cv_SC.tex .github/workflows/refine-publication-links.yml
          git commit -m "Use approved preprint links and style CV links"
          git push
